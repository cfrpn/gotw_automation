# GOTW weekly leaderboard archive.
#
# The leaderboard window itself is no longer managed by a job: both
# ruby_sweeps._logs.lems_gotw_ongoing_leaderboard (see ../src/gotw_view_template.sql)
# and lems2.0/server.js compute the current 7-day period independently from a
# shared fixed anchor, so there is nothing to generate, review, or deploy each
# week anymore. This job only archives a snapshot of the leaderboard to Google
# Sheets for record-keeping -- read-only, non-destructive, so no review gate.
#
# Scheduled for 15:05 Monday New Zealand local time -- 5 minutes after the
# period boundary, which is itself fixed in NZ local time (Monday 15:00
# Pacific/Auckland, changed 2026-11-11). Because the boundary and the
# schedule are now in the same timezone, the 5-minute margin is constant
# year-round across NZ DST changes. (History: while the boundary was a
# fixed 02:00 UTC, this schedule was anchored in UTC for the same reason --
# an earlier fixed-NZT schedule had drifted to zero margin under NZDT.)
# Don't shrink this margin without checking Databricks' actual trigger
# jitter first: if the job fires even slightly before the boundary,
# last_completed_period() silently archives the wrong (one-week-stale) period.

resources:
  jobs:
    gotw_weekly_export:
      name: gotw-weekly-export

      schedule:
        quartz_cron_expression: "0 5 15 ? * MON"
        timezone_id: "Pacific/Auckland"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - nina.zhou@rubyplaynetwork.com

      tasks:
        - task_key: export_and_archive
          max_retries: 2
          notebook_task:
            notebook_path: ../src/gotw_weekly_export/export_and_archive.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - gspread
              - google-auth
