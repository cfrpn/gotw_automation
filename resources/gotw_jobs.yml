# GOTW weekly leaderboard archive.
#
# The leaderboard window itself is no longer managed by a job: both
# ruby_sweeps._logs.lems_gotw_ongoing_leaderboard (see ../src/gotw_view_template.sql)
# and lems2.0/server.js compute the current 7-day period independently from a
# shared fixed anchor, so there is nothing to generate, review, or deploy each
# week anymore. This job only archives a snapshot of the leaderboard to Google
# Sheets for record-keeping -- read-only, non-destructive, so no review gate.
#
# Scheduled for 15:20 Monday New Zealand local time -- 20 minutes after the
# period boundary, which is itself fixed in NZ local time (Monday 15:00
# Pacific/Auckland, changed 2026-11-11). Because the boundary and the
# schedule are in the same timezone, the margin is constant year-round
# across NZ DST changes.
#
# Why 20 minutes and not 5 (changed 2026-11-16): bets reach bronze.bets
# about 10 minutes after they're placed, and the archive is the official
# final result, so it must include every bet up to the boundary (the last
# hours are Final Six at double points). The script also waits until bets
# placed after the boundary have landed before writing anything, and fails
# instead of archiving an incomplete week. Marketing pays prizes from the
# Sheet after this has run.
#
# Never schedule this before the boundary: last_completed_period() would
# silently archive the wrong (one-week-stale) period.

resources:
  jobs:
    gotw_weekly_export:
      name: gotw-weekly-export

      schedule:
        quartz_cron_expression: "0 20 15 ? * MON"
        timezone_id: "Pacific/Auckland"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - nina.zhou@rubyplaynetwork.com

      tasks:
        - task_key: export_and_archive
          max_retries: 2
          notebook_task:
            notebook_path: ../src/gotw_weekly_export/export_and_archive.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - gspread
              - google-auth
