# GOTW weekly leaderboard archive.
#
# The leaderboard window itself is no longer managed by a job: both
# ruby_sweeps._logs.lems_gotw_ongoing_leaderboard (see ../src/gotw_view_template.sql)
# and lems2.0/server.js compute the current 7-day period independently from a
# shared fixed anchor, so there is nothing to generate, review, or deploy each
# week anymore. This job only archives a snapshot of the leaderboard to Google
# Sheets for record-keeping -- read-only, non-destructive, so no review gate.
#
# Scheduled for 02:05 UTC Monday -- 5 minutes after the period boundary
# (a fixed 02:00 UTC). Anchored in UTC rather than NZT on purpose: an
# earlier version pinned a fixed NZT wall-clock time (16:00), but the
# boundary's NZT equivalent itself moves with daylight saving (14:00 NZT
# under NZST, 15:00 NZT under NZDT), so a fixed-NZT schedule gives a
# different margin each season -- and a fixed 15:00 NZT version coincided
# exactly with the boundary during NZDT (zero margin, a real race-condition
# risk: last_completed_period()'s floor division would silently pick the
# wrong, one-week-stale period if `now` lands even slightly before the true
# boundary). Anchoring in UTC keeps the 5-minute margin constant in both
# DST states with no manual re-pinning twice a year. Don't shrink this
# margin without checking Databricks' actual trigger jitter first.

resources:
  jobs:
    gotw_weekly_export:
      name: gotw-weekly-export

      schedule:
        quartz_cron_expression: "0 5 2 ? * MON"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - nina.zhou@rubyplaynetwork.com

      tasks:
        - task_key: export_and_archive
          max_retries: 2
          notebook_task:
            notebook_path: ../src/gotw_weekly_export/export_and_archive.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - gspread
              - google-auth
