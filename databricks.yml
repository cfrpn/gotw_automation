# Declarative Automation Bundle for the GOTW (Game of the Week) weekly automation.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
#
# Originally replaced the manual Tuesday process (export leaderboard -> paste
# into Sheet -> hand-edit SQL view -> hand-edit Railway variables + deploy).
# The window now rolls over on its own; all that's left is a single archive
# job (resources/gotw_jobs.yml). See README.md for current state.
bundle:
  name: gotw_automation
  uuid: 21b0197f-cf7e-4ac9-8ab8-1b082b7bfad3

include:
  - resources/*.yml

targets:
  dev:
    # mode: development prefixes resource names with '[dev <user>]', but does
    # NOT auto-pause schedules when the job itself sets pause_status
    # explicitly (ours does, so prod can be UNPAUSED) -- so this target force-
    # pauses the schedule itself, or dev and prod would both fire every Monday
    # and race to write the same-named tab into the same Google Sheet.
    mode: development
    default: true
    workspace:
      host: https://dbc-1a1b8180-343f.cloud.databricks.com
    resources:
      jobs:
        gotw_weekly_export:
          schedule:
            quartz_cron_expression: "0 5 2 ? * MON"
            timezone_id: "UTC"
            pause_status: PAUSED
  prod:
    mode: production
    workspace:
      host: https://dbc-1a1b8180-343f.cloud.databricks.com
      root_path: /Workspace/Users/nina.zhou@rubyplaynetwork.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: nina.zhou@rubyplaynetwork.com
        level: CAN_MANAGE
